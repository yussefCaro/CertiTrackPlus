{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Diagnóstico Logo WeasyPrint</title>
  <style>
    @page {
      size: A4;
      margin: 2cm;
    }
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    .logo {
      margin-top: 40px;
      margin-bottom: 30px;
    }
    .info {
      font-size: 18px;
      color: #333;
      margin-top: 30px;
    }
    .ruta {
      font-size: 13px;
      color: #888;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="logo">
    <h2>Prueba de Logo en PDF</h2>
    <img src="{{ logo_url }}" alt="Logo por URL estática" style="height:60px;">
    <img src="{{ logo_path }}" alt="Logo por ruta absoluta" style="height:60px;">

  </div>
  <div class="info">
    Si ves el logo arriba, la configuración es correcta.<br>
    Si NO lo ves, revisa la ruta, permisos y <b>base_url</b> en tu vista.
  </div>
  <div class="ruta">
    Ruta usada: <br>
    <code>{% static 'myapp/AQ_color.png' %}</code>
  </div>
  <div class="info">
    Puedes probar también con la URL absoluta:<br>
    <img src="https://certitrackplus-1.onrender.com/static/myapp/AQ_color.png" alt="Logo AQ Certification" style="height:60px; border:1px dashed #aaa;">
  </div>
</body>
</html>
